name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - run: uv run ruff check ediscovery_copilot tests scripts
      - run: uv run ruff format --check ediscovery_copilot tests
      - run: uv run pytest -q --cov=ediscovery_copilot --cov-report=term
      - run: uv run python -m ediscovery_copilot.evalkit
